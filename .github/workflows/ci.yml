name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: swiftopus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: .build
          key: swiftopus-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', '.gitmodules') }}
          restore-keys: |
            swiftopus-${{ runner.os }}-${{ runner.arch }}-
      - name: Test Swift package
        run: swift test
      - name: Build arm64 COpus archive
        run: |
          swift build -c release \
            --product COpus \
            --triple arm64-apple-macosx14.0 \
            --scratch-path .build/copus-arm64
          archive="$(find .build/copus-arm64 -type f -name libCOpus.a -print -quit)"
          test -n "$archive"
          test "$(lipo -archs "$archive")" = arm64
      - name: Build x86_64 COpus archive
        run: |
          swift build -c release \
            --product COpus \
            --triple x86_64-apple-macosx14.0 \
            --scratch-path .build/copus-x86_64
          archive="$(find .build/copus-x86_64 -type f -name libCOpus.a -print -quit)"
          test -n "$archive"
          test "$(lipo -archs "$archive")" = x86_64
      - name: Validate Apple platform binary product
        run: |
          swift package describe >/dev/null
          plutil -lint Artifacts/COpus.xcframework/Info.plist
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          root = Path("Artifacts/COpus.xcframework")
          with (root / "Info.plist").open("rb") as file:
              libraries = plistlib.load(file)["AvailableLibraries"]

          actual = {
              (
                  library["SupportedPlatform"],
                  library.get("SupportedPlatformVariant"),
                  tuple(sorted(library["SupportedArchitectures"])),
              )
              for library in libraries
          }
          expected = {
              ("macos", None, ("arm64", "x86_64")),
              ("ios", None, ("arm64",)),
              ("ios", "simulator", ("arm64", "x86_64")),
              ("ios", "maccatalyst", ("arm64", "x86_64")),
              ("tvos", None, ("arm64",)),
              ("tvos", "simulator", ("arm64", "x86_64")),
              ("watchos", None, ("arm64_32",)),
              ("watchos", "simulator", ("arm64", "x86_64")),
              ("xros", None, ("arm64",)),
              ("xros", "simulator", ("arm64",)),
          }
          if actual != expected:
              raise SystemExit(f"Unexpected XCFramework slices: {actual}")

          for library in libraries:
              directory = root / library["LibraryIdentifier"]
              if not (directory / library["LibraryPath"]).is_file():
                  raise SystemExit(f"Missing archive for {library['LibraryIdentifier']}")
              if not (directory / library["HeadersPath"] / "module.modulemap").is_file():
                  raise SystemExit(f"Missing module map for {library['LibraryIdentifier']}")
          PY
