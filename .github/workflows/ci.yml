name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: swiftopus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: .build
          key: swiftopus-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', '.gitmodules') }}
          restore-keys: |
            swiftopus-${{ runner.os }}-${{ runner.arch }}-
      - name: Test Swift package
        run: swift test
      - name: Build arm64 COpus archive
        run: |
          swift build -c release \
            --product COpus \
            --triple arm64-apple-macosx14.0 \
            --scratch-path .build/copus-arm64
          archive="$(find .build/copus-arm64 -type f -name libCOpus.a -print -quit)"
          test -n "$archive"
          test "$(lipo -archs "$archive")" = arm64
      - name: Build x86_64 COpus archive
        run: |
          swift build -c release \
            --product COpus \
            --triple x86_64-apple-macosx14.0 \
            --scratch-path .build/copus-x86_64
          archive="$(find .build/copus-x86_64 -type f -name libCOpus.a -print -quit)"
          test -n "$archive"
          test "$(lipo -archs "$archive")" = x86_64
      - name: Build SwiftOpus for every Apple platform
        run: |
          build_product() {
            local name="$1"
            local triple="$2"
            local sdk="$3"
            swift build -c release \
              --product SwiftOpus \
              --triple "$triple" \
              --sdk "$(xcrun --sdk "$sdk" --show-sdk-path)" \
              --scratch-path ".build/platforms/$name"
          }
          build_product macos-arm64 arm64-apple-macosx14.0 macosx
          build_product macos-x86_64 x86_64-apple-macosx14.0 macosx
          build_product ios-arm64 arm64-apple-ios17.0 iphoneos
          build_product ios-simulator-arm64 arm64-apple-ios17.0-simulator iphonesimulator
          build_product ios-simulator-x86_64 x86_64-apple-ios17.0-simulator iphonesimulator
          build_product catalyst-arm64 arm64-apple-ios17.0-macabi macosx
          build_product catalyst-x86_64 x86_64-apple-ios17.0-macabi macosx
          build_product tvos-arm64 arm64-apple-tvos17.0 appletvos
          build_product tvos-simulator-arm64 arm64-apple-tvos17.0-simulator appletvsimulator
          build_product tvos-simulator-x86_64 x86_64-apple-tvos17.0-simulator appletvsimulator
          build_product watchos-arm64_32 arm64_32-apple-watchos10.0 watchos
          build_product watchos-simulator-arm64 arm64-apple-watchos10.0-simulator watchsimulator
          build_product watchos-simulator-x86_64 x86_64-apple-watchos10.0-simulator watchsimulator
          build_product visionos-arm64 arm64-apple-xros1.0 xros
          build_product visionos-simulator-arm64 arm64-apple-xros1.0-simulator xrsimulator
